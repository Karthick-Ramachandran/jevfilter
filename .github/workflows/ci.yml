name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # Consumers may run Node 20: build once, then import the packed tarball on Node 20.
  node20-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm pack
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/jevfilter-*.tgz @typesafe-ai/sdk@0.6.0
          node --input-type=module -e '
            import { createNaturalFilter, defineSearch, enumField, keywordProvider } from "jevfilter";
            import { jev } from "jevfilter/jev";
            const nf = createNaturalFilter({ schema: defineSearch({ resource: "tickets", fields: { status: enumField(["open", "closed"]) } }), provider: keywordProvider(), allowUnauthenticated: true });
            const r = await nf.prepare("open tickets");
            if (r.status !== "ready" || r.filters.status !== "open" || typeof jev !== "function") process.exit(1);
            console.log("ok", JSON.stringify(r.filters));'
